# Docker Compose for horizontal scaling
# Usage: docker-compose -f docker-compose.yml -f docker-compose.scaling.yml up -d --scale api=3

services:
  api:
    ports:
      - "3001-3003:3001"
    environment:
      - NODE_ENV=production
      - REDIS_HOST=redis
      - REDIS_PORT=6379

  # Load balancer (nginx)
  nginx:
    image: nginx:alpine
    container_name: tradezen-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
    networks:
      tradezen-net:
        ipv4_address: 172.28.1.30
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.25'
