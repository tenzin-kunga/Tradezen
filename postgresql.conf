# ── postgresql.conf — Production-Optimized Settings ─────────────────────────
# Place this file at ./postgresql.conf relative to docker-compose.yml
# Mounted as read-only into the container
#
# Usage in docker-compose.yml:
#   volumes:
#     - ./postgresql.conf:/etc/postgresql/postgresql.conf:ro
#   command: postgres -c config_file=/etc/postgresql/postgresql.conf

# ── Connection Settings ──────────────────────────────────────────────────────
listen_addresses = '*'          # Listen on all interfaces (Docker network)
max_connections = 200           # Adjust based on workload
superuser_reserved_connections = 3

# ── Memory ───────────────────────────────────────────────────────────────────
shared_buffers = 256MB          # 25% of RAM (if 1GB container limit)
effective_cache_size = 768MB    # ~75% of RAM
work_mem = 4MB                  # Per-operation memory (increase for sorts)
maintenance_work_mem = 64MB     # For VACUUM, CREATE INDEX

# ── WAL (Write-Ahead Logging) ────────────────────────────────────────────────
wal_level = replica
wal_buffers = 16MB
checkpoint_completion_target = 0.9
max_wal_size = 4GB
min_wal_size = 1GB

# ── Autovacuum ───────────────────────────────────────────────────────────────
autovacuum = on
autovacuum_max_workers = 6
autovacuum_naptime = 10s
autovacuum_vacuum_threshold = 50
autovacuum_analyze_threshold = 50

# ── Logging ──────────────────────────────────────────────────────────────────
log_destination = 'stderr'
logging_collector = off
log_min_duration_statement = 1000  # Log queries > 1s (ms)
log_line_prefix = '%m [%p] %q%u@%d '
log_checkpoints = on
log_connections = on
log_disconnections = on

# ── Performance Tuning ───────────────────────────────────────────────────────
random_page_cost = 1.1           # SSD storage
effective_io_concurrency = 200  # SSD I/O parallelism
default_statistics_target = 100

# ── Query Planning ───────────────────────────────────────────────────────────
seq_page_cost = 1.0
cpu_tuple_cost = 0.01
cpu_index_tuple_cost = 0.005

# ── Stability ────────────────────────────────────────────────────────────────
max_parallel_workers_per_gather = 4
max_parallel_workers = 8
max_parallel_maintenance_workers = 4

# ── SSL (uncomment for production) ──────────────────────────────────────────
# ssl = on
# ssl_cert_file = '/etc/ssl/certs/server.crt'
# ssl_key_file = '/etc/ssl/private/server.key'

# ── Replication (if needed) ──────────────────────────────────────────────────
# wal_sender_timeout = 1min
# wal_receiver_timeout = 1min
