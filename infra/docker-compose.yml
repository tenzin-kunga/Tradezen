# ── Networks ────────────────────────────────────────────────────────────────
networks:
  tradezen-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

# ── Volumes ─────────────────────────────────────────────────────────────────
volumes:
  pgdata:
    driver: local
  redisdata:
    driver: local
  ollama_data:
    driver: local

# ── Services ────────────────────────────────────────────────────────────────
services:
  # ── PostgreSQL ────────────────────────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    container_name: tradezen-db
    restart: unless-stopped
    environment:
      # Use environment variables with sensible defaults
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-tradezen}
      PGDATA: /var/lib/postgresql/data/pgdata
    networks:
      tradezen-net:
        ipv4_address: 172.28.1.10
    volumes:
      # Named volume for data persistence
      - pgdata:/var/lib/postgresql/data
      # Optional: custom PostgreSQL config (create this file for tuning)
      # - ./docker/postgresql.conf:/etc/postgresql/postgresql.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '0.50'
        reservations:
          memory: 512M
          cpus: '0.25'
    # Do not expose to host in production; only needed for local dev
    # In production, API connects via internal network
    ports:
      - "127.0.0.1:5432:5432"  # bind to localhost only if needed

  # ── Redis ─────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: tradezen-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --save 60 1000 --maxmemory 128mb --maxmemory-policy noeviction
    networks:
      tradezen-net:
        ipv4_address: 172.28.1.11
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'
        reservations:
          memory: 128M
          cpus: '0.10'
    ports:
      - "127.0.0.1:6379:6379"

  # ── API (NestJS) ──────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: ./apps/api/Dockerfile
      # Enable BuildKit cache optimization
      cache_from:
        - type=local,src=/tmp/.buildx-cache-api
      cache_to:
        - type=local,dest=/tmp/.buildx-cache-api,mode=max
    container_name: tradezen-api
    restart: unless-stopped
    networks:
      tradezen-net:
        ipv4_address: 172.28.1.20
    environment:
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@postgres:5432/${DB_NAME:-tradezen}?sslmode=disable
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      WEB_URL: ${WEB_URL:-http://localhost:3000}
      NODE_ENV: production
      PORT: 3001
      REDIS_HOST: redis
      REDIS_PORT: '6379'
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL:-http://localhost:3001/auth/google/callback}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GITHUB_CALLBACK_URL: ${GITHUB_CALLBACK_URL:-http://localhost:3001/auth/github/callback}
      SENTRY_DSN: ${SENTRY_DSN:-}
      AI_SERVICE_URL: ${AI_SERVICE_URL:-http://ai-service:8000}
      AI_SERVICE_API_KEY: ${NESTJS_INTERNAL_API_KEY:-tradezen-internal}
      AI_MODEL: ${AI_MODEL:-qwen3:latest}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ai-service:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.50'
        reservations:
          memory: 256M
          cpus: '0.25'
    # Expose only if accessing directly (typically behind reverse proxy)
    # ports:
    #   - "127.0.0.1:3001:3001"

  # ── Database Backup ─────────────────────────────────────────────────────
  backup:
    image: alpine:latest
    container_name: tradezen-backup
    restart: "no"
    volumes:
      - ../scripts/db:/scripts:ro
      - ../backups:/backups
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - RETENTION_DAYS=30
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "0 2 * * * /scripts/backup.sh /backups" > /etc/crontabs/root
        crond -f -l 2
    depends_on:
      postgres:
        condition: service_healthy

  # ── Web (Next.js) ─────────────────────────────────────────────────────────
  web:
    build:
      context: .
      dockerfile: ./apps/web/Dockerfile
      cache_from:
        - type=local,src=/tmp/.buildx-cache-web
      cache_to:
        - type=local,dest=/tmp/.buildx-cache-web,mode=max
    container_name: tradezen-web
    restart: unless-stopped
    networks:
      tradezen-net:
        ipv4_address: 172.28.1.21
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://api:3001
      NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
      SENTRY_AUTH_TOKEN: ${SENTRY_AUTH_TOKEN:-}
    depends_on:
      api:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ | head -1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.50'
        reservations:
          memory: 256M
          cpus: '0.25'
    ports:
      # Expose to host; in production use reverse proxy (nginx, traefik)
      - "127.0.0.1:3000:3000"

  # ── AI Service (FastAPI) ───────────────────────────────────────────────────
  ai-service:
    build:
      context: ..
      dockerfile: ./apps/ai-service/Dockerfile
    container_name: tradezen-ai
    restart: unless-stopped
    networks:
      tradezen-net:
        ipv4_address: 172.28.1.30
    environment:
      AI_PROVIDER: ${AI_PROVIDER:-ollama}
      DEFAULT_MODEL: ${DEFAULT_MODEL:-qwen3:4b}
      OLLAMA_HOST: http://ollama:11434
      AUTH_SECRET: ${JWT_SECRET}
      NESTJS_INTERNAL_API_KEY: ${NESTJS_INTERNAL_API_KEY:-tradezen-internal}
      MAX_CONCURRENT_OLLAMA: ${MAX_CONCURRENT_OLLAMA:-4}
      DAILY_COST_BUDGET: ${DAILY_COST_BUDGET:-20.0}
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/health').raise_for_status()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
        reservations:
          memory: 512M
          cpus: '0.50'

  # ── Ollama (local LLM) ───────────────────────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: tradezen-ollama
    restart: unless-stopped
    profiles:
      - ai
    networks:
      tradezen-net:
        ipv4_address: 172.28.1.40
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "127.0.0.1:11434:11434"
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: '2.0'
        reservations:
          memory: 2G
          cpus: '1.0'

# ── Notes ───────────────────────────────────────────────────────────────────
# 1. Create a `.env.docker` file in project root with:
#    DB_PASSWORD=<strong-random-password>
#    JWT_SECRET=<long-random-string>
#    JWT_REFRESH_SECRET=<another-long-random-string>
#    WEB_URL=http://localhost:3000
#
# 2. Load it when starting:
#    `docker compose --file infra/docker-compose.yml --env-file .env.docker up -d`
#
# 3. In production, use a secrets manager (Docker secrets, Kubernetes secrets,
#    or cloud provider secret store) instead of .env files.
#
# 4. To enable local DB access for psql, temporarily expose port:
#    Uncomment the `ports` section under `postgres` service, then:
#    `psql -h localhost -p 5432 -U postgres -d tradezen`
