name: Deploy (Disabled — superseded by ci.yml)

# This workflow has been consolidated into .github/workflows/ci.yml.
# Kept as a reference for self-hosted docker-compose deploys only.
# Trigger removed (was: push to main) — file remains for documentation purposes.

on:
  workflow_dispatch:  # Manual trigger only; do not auto-run

jobs:
  notify-disabled:
    name: Workflow Disabled
    runs-on: ubuntu-latest
    steps:
      - name: Inform
        run: |
          echo "This workflow is disabled. Use ci.yml -> deploy-production job instead."
          echo "For self-hosted docker-compose deploys, see scripts/deploy-selfhosted.sh (not yet implemented)."
          exit 1
