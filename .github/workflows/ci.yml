name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

env:
  NODE_VERSION: '20'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

# Cancel in-progress runs for the same branch on new push
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read
  security-events: write
  pull-requests: write
  actions: read

# ── Jobs ─────────────────────────────────────────────────────────────────────
jobs:
  # ── 1. CHANGED-PATH DETECTION ──────────────────────────────────────────────
  changes:
    name: Detect Changed Paths
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      web: ${{ steps.filter.outputs.web }}
      docs: ${{ steps.filter.outputs.docs }}
      any: ${{ steps.filter.outputs.any }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            api:
              - 'apps/api/**'
              - 'apps/api/Dockerfile'
              - 'packages/db/**'
              - 'bun.lock'
              - 'package.json'
            web:
              - 'apps/web/**'
              - 'apps/web/Dockerfile'
              - 'bun.lock'
              - 'package.json'
            docs:
              - '**.md'
              - '.github/ISSUE_TEMPLATE/**'
            any:
              - '**'

  # ── 2. SECURITY AUDIT ─────────────────────────────────────────────────────
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.any == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run npm audit (dependency vulnerabilities)
        run: |
          npm audit --omit=dev --audit-level=high > npm-audit.json 2>&1 || true
        continue-on-error: true

      - name: Upload npm audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-report
          path: npm-audit.json
          retention-days: 30

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-fs.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy fs scan to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-fs.sarif'

      - name: Scan for hardcoded secrets
        run: |
          echo "Scanning for hardcoded secrets..."
          ! grep -rE "sk-or-v1-[A-Za-z0-9]{20,}" . --include="*.ts" --include="*.js" --include="*.env*" --exclude-dir=node_modules 2>/dev/null
          ! grep -rE "JWT_SECRET.*=.*['\"]tradezen-dev-secret" . --include="*.ts" --exclude-dir=node_modules 2>/dev/null
        continue-on-error: true

  # ── 3. LINT & TYPE CHECK ──────────────────────────────────────────────────
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.any == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run ESLint
        run: bun run lint

      - name: Run TypeScript type check
        run: bun run check-types

  # ── 4. UNIT TESTS ──────────────────────────────────────────────────────────
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: [lint, changes]
    if: needs.changes.outputs.api == 'true' || needs.changes.outputs.web == 'true'
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tradezen_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
    env:
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: tradezen_test
      JWT_SECRET: test-jwt-secret-must-be-at-least-64-characters-long-for-validation
      JWT_REFRESH_SECRET: test-refresh-secret-must-be-at-least-64-characters-long
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run migrations
        if: needs.changes.outputs.api == 'true'
        run: bun run --filter=@tradezen/api migrate

      - name: Run unit tests with coverage
        run: bun run --filter=@tradezen/api test -- --coverage 2>/dev/null || echo "No tests defined"

      - name: Upload coverage to Codecov
        if: github.ref == 'refs/heads/main'
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/**/lcov.info
          fail_ci_if_error: false
          flags: unittests
          version: 'v4'

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            ./coverage
            ./junit.xml
          retention-days: 14

  # ── 5. E2E TESTS ───────────────────────────────────────────────────────────
  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [test, changes]
    if: needs.changes.outputs.api == 'true'
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tradezen_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
    env:
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: tradezen_test
      JWT_SECRET: test-jwt-secret-must-be-at-least-64-characters-long-for-validation
      JWT_REFRESH_SECRET: test-refresh-secret-must-be-at-least-64-characters-long
      WEB_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run database migrations
        run: bun run --filter=@tradezen/api migrate

      - name: Run E2E tests
        run: bun run --filter=@tradezen/api test:e2e

      - name: Upload E2E test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: ./coverage
          retention-days: 14

  # ── 6. DOCKER BUILD — API ──────────────────────────────────────────────────
  build-api:
    name: Build API image
    runs-on: ubuntu-latest
    needs: [test, e2e, security, changes]
    if: needs.changes.outputs.api == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/api
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix={{branch}}-
            type=raw,value=api-latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=TradeZen API
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Build and push API image
        uses: docker/build-push-action@v5
        with:
          context: ./apps/api
          file: ./apps/api/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max
          provenance: false
          platforms: linux/amd64,linux/arm64

      - name: Scan API image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'image'
          scan-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/api:${{ steps.meta.outputs.version }}
          format: 'sarif'
          output: 'trivy-image-api.sarif'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true

      - name: Upload Trivy API image scan
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-image-api.sarif'

  # ── 7. DOCKER BUILD — WEB ──────────────────────────────────────────────────
  build-web:
    name: Build Web image
    runs-on: ubuntu-latest
    needs: [test, e2e, security, changes]
    if: needs.changes.outputs.web == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/web
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix={{branch}}-
            type=raw,value=web-latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=TradeZen Web
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Build and push Web image
        uses: docker/build-push-action@v5
        with:
          context: ./apps/web
          file: ./apps/web/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max
          provenance: false
          platforms: linux/amd64,linux/arm64

  # ── 8. STAGING DEPLOY (develop branch) ─────────────────────────────────────
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [build-api, build-web]
    if: github.ref == 'refs/heads/develop'
    environment:
      name: deploy-staging
      url: ${{ steps.deploy-web.outputs.url }}
    concurrency: deploy-staging
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Vercel CLI
        run: bun install -g vercel@latest

      - name: Deploy API to Render (staging)
        id: deploy-api
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_STAGING_SERVICE_ID: ${{ secrets.RENDER_STAGING_SERVICE_ID }}
        run: |
          echo "Triggering Render staging deploy..."
          curl -fsS -X POST "https://api.render.com/v1/services/$RENDER_STAGING_SERVICE_ID/deploys" \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Content-Type: application/json" \
            -d '{"clearCache":true}' | tee deploy-response.json
          DEPLOY_ID=$(cat deploy-response.json | jq -r '.id // .deploy.id // empty')
          echo "deploy_id=$DEPLOY_ID" >> "$GITHUB_OUTPUT"

      - name: Wait for staging API to be ready
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          DEPLOY_ID: ${{ steps.deploy-api.outputs.deploy_id }}
          SERVICE_ID: ${{ secrets.RENDER_STAGING_SERVICE_ID }}
        run: |
          for i in {1..60}; do
            STATUS=$(curl -fsS "https://api.render.com/v1/services/$SERVICE_ID/deploys/$DEPLOY_ID" \
              -H "Authorization: Bearer $RENDER_API_KEY" | jq -r '.status')
            echo "Deploy status: $STATUS (attempt $i/60)"
            if [ "$STATUS" = "live" ]; then break; fi
            if [ "$STATUS" = "build_failed" ] || [ "$STATUS" = "update_failed" ]; then
              echo "Deploy failed: $STATUS"
              exit 1
            fi
            sleep 10
          done

      - name: Deploy Web to Vercel (preview)
        id: deploy-web
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
        run: |
          echo "Triggering Vercel preview deploy..."
          vercel pull --yes --environment=preview --token=$VERCEL_TOKEN
          vercel deploy --yes --token=$VERCEL_TOKEN 2>&1 | tee vercel-output.txt
          URL=$(grep -oE 'https://[a-zA-Z0-9-]+\.vercel\.app' vercel-output.txt | head -1)
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Smoke test staging
        env:
          API_URL: ${{ secrets.STAGING_API_URL }}
          WEB_URL: ${{ steps.deploy-web.outputs.url }}
        run: |
          echo "Smoke testing $API_URL/health ..."
          for i in {1..30}; do
            if curl -fsS "$API_URL/health" | grep -q '"status":"ok"'; then
              echo "API health OK"
              break
            fi
            echo "Waiting for API... ($i/30)"
            sleep 5
          done
          if ! curl -fsS "$API_URL/health" | grep -q '"status":"ok"'; then
            echo "API health check failed"
            exit 1
          fi
          echo "Smoke testing $WEB_URL ..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$WEB_URL")
          if [ "$HTTP_STATUS" -lt 200 ] || [ "$HTTP_STATUS" -ge 400 ]; then
            echo "Web returned HTTP $HTTP_STATUS"
            exit 1
          fi
          echo "Smoke tests passed"

  # ── 9. PRODUCTION DEPLOY (main branch) ─────────────────────────────────────
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build-api, build-web]
    if: github.ref == 'refs/heads/main'
    environment:
      name: deploy-prod
      url: ${{ steps.deploy-web.outputs.url }}
    concurrency: deploy-prod
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Vercel CLI
        run: bun install -g vercel@latest

      - name: Deploy API to Render
        id: deploy-api
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          echo "Triggering Render production deploy..."
          curl -fsS -X POST "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys" \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Content-Type: application/json" \
            -d '{"clearCache":true}' | tee deploy-response.json
          DEPLOY_ID=$(cat deploy-response.json | jq -r '.id // .deploy.id // empty')
          echo "deploy_id=$DEPLOY_ID" >> "$GITHUB_OUTPUT"

      - name: Wait for prod API to be ready
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          DEPLOY_ID: ${{ steps.deploy-api.outputs.deploy_id }}
          SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          for i in {1..90}; do
            STATUS=$(curl -fsS "https://api.render.com/v1/services/$SERVICE_ID/deploys/$DEPLOY_ID" \
              -H "Authorization: Bearer $RENDER_API_KEY" | jq -r '.status')
            echo "Deploy status: $STATUS (attempt $i/90)"
            if [ "$STATUS" = "live" ]; then break; fi
            if [ "$STATUS" = "build_failed" ] || [ "$STATUS" = "update_failed" ]; then
              echo "Deploy failed: $STATUS — rolling back"
              curl -fsS -X POST "https://api.render.com/v1/services/$SERVICE_ID/rollback" \
                -H "Authorization: Bearer $RENDER_API_KEY" || true
              exit 1
            fi
            sleep 10
          done

      - name: Deploy Web to Vercel
        id: deploy-web
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
        run: |
          vercel pull --yes --environment=production --token=$VERCEL_TOKEN
          vercel deploy --yes --prod --token=$VERCEL_TOKEN 2>&1 | tee vercel-output.txt
          URL=$(grep -oE 'https://[a-zA-Z0-9-]+\.vercel\.app' vercel-output.txt | head -1)
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Smoke test production
        env:
          API_URL: ${{ secrets.PRODUCTION_API_URL }}
          WEB_URL: ${{ steps.deploy-web.outputs.url }}
        run: |
          echo "Smoke testing $API_URL/health ..."
          for i in {1..30}; do
            if curl -fsS "$API_URL/health" | grep -q '"status":"ok"'; then
              echo "API health OK"
              break
            fi
            echo "Waiting for API... ($i/30)"
            sleep 5
          done
          if ! curl -fsS "$API_URL/health" | grep -q '"status":"ok"'; then
            echo "API health check failed — rolling back"
            curl -fsS -X POST "https://api.render.com/v1/services/${{ secrets.RENDER_SERVICE_ID }}/rollback" \
              -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" || true
            exit 1
          fi
          echo "Smoke testing $WEB_URL ..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$WEB_URL")
          if [ "$HTTP_STATUS" -lt 200 ] || [ "$HTTP_STATUS" -ge 400 ]; then
            echo "Web returned HTTP $HTTP_STATUS — rolling back"
            curl -fsS -X POST "https://api.render.com/v1/services/${{ secrets.RENDER_SERVICE_ID }}/rollback" \
              -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" || true
            exit 1
          fi
          echo "Production smoke tests passed"
